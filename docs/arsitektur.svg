<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker>
  </defs>
  <rect width="1000" height="690" fill="#ffffff"/>
  <text x="500" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Arsitektur Platform Tiket Event/Konser (Kelompok B)</text>

  <!-- Klien -->
  <rect x="280" y="42" width="240" height="46" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="400" y="70" text-anchor="middle" font-size="14" fill="#111827">Klien (Postman / Web / Mobile)</text>
  <line x1="400" y1="88" x2="400" y2="122" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="412" y="110" font-size="12" fill="#374151">HTTPS</text>

  <!-- Gateway -->
  <rect x="240" y="122" width="320" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">API Gateway :8080</text>
  <text x="400" y="170" text-anchor="middle" font-size="12" fill="#1e3a8a">Verifikasi JWT (JWKS) · Rate limiting</text>
  <text x="400" y="188" text-anchor="middle" font-size="12" fill="#1e3a8a">Routing · Load balancing round-robin</text>
  <text x="400" y="206" text-anchor="middle" font-size="12" fill="#1e3a8a">Blokir /internal · Hapus header x-user-*</text>

  <!-- Redis (rate limit) -->
  <rect x="30" y="135" width="170" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="115" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">Redis 7</text>
  <text x="115" y="183" text-anchor="middle" font-size="12" fill="#7f1d1d">rate limit + antrian</text>
  <line x1="240" y1="170" x2="200" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- Message queue -->
  <rect x="740" y="122" width="230" height="96" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="855" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#831843">Message Queue</text>
  <text x="855" y="170" text-anchor="middle" font-size="12" fill="#831843">BullMQ di atas Redis</text>
  <text x="855" y="188" text-anchor="middle" font-size="12" fill="#831843">retry (backoff) · dead-letter</text>
  <text x="855" y="206" text-anchor="middle" font-size="12" fill="#831843">jobId = orderId (anti ganda)</text>

  <!-- Gateway -> services -->
  <line x1="300" y1="218" x2="150" y2="272" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="400" y1="218" x2="385" y2="272" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="218" x2="810" y2="272" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- Order -> queue -> worker (asinkron) -->
  <line x1="900" y1="272" x2="900" y2="218" stroke="#be185d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#q)"/>
  <text x="912" y="250" font-size="11" fill="#be185d">publish</text>
  <line x1="770" y1="218" x2="705" y2="272" stroke="#be185d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#q)"/>
  <text x="755" y="256" font-size="11" fill="#be185d">consume</text>

  <!-- Auth -->
  <rect x="30" y="272" width="220" height="112" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="140" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">Auth Service :4000</text>
  <text x="140" y="320" text-anchor="middle" font-size="12" fill="#78350f">OAuth2 (password + client creds)</text>
  <text x="140" y="338" text-anchor="middle" font-size="12" fill="#78350f">JWT RS256 · JWKS · Registrasi</text>
  <text x="140" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#78350f">1 instance</text>

  <!-- Event -->
  <rect x="270" y="272" width="220" height="112" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">Event Service :4001</text>
  <text x="380" y="320" text-anchor="middle" font-size="12" fill="#14532d">Katalog REST + GraphQL</text>
  <text x="380" y="338" text-anchor="middle" font-size="12" fill="#14532d">Pemilik stok · reservasi internal</text>
  <text x="380" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">2 replika</text>

  <!-- Worker -->
  <rect x="510" y="272" width="220" height="112" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="620" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#831843">Worker</text>
  <text x="620" y="320" text-anchor="middle" font-size="12" fill="#831843">Proses antrian satu per satu</text>
  <text x="620" y="338" text-anchor="middle" font-size="12" fill="#831843">Reservasi stok · sweeper PENDING</text>
  <text x="620" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#831843">1 instance</text>
  <line x1="510" y1="335" x2="492" y2="335" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- Order -->
  <rect x="750" y="272" width="220" height="112" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="860" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">Order Service :4002</text>
  <text x="860" y="320" text-anchor="middle" font-size="12" fill="#4c1d95">Terima pesanan → 202 PENDING</text>
  <text x="860" y="338" text-anchor="middle" font-size="12" fill="#4c1d95">Idempotency-Key · riwayat pesanan</text>
  <text x="860" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">2 replika</text>

  <!-- Services -> DB -->
  <line x1="140" y1="384" x2="140" y2="439" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="384" x2="380" y2="439" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="620" y1="384" x2="620" y2="439" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="860" y1="384" x2="860" y2="439" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- PostgreSQL -->
  <rect x="30" y="440" width="940" height="146" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="500" y="466" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c4a6e">PostgreSQL 16 (database: ticketing)</text>
  <rect x="50" y="502" width="210" height="64" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="155" y="527" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c4a6e">schema auth</text>
  <text x="155" y="548" text-anchor="middle" font-size="12" fill="#0c4a6e">users · clients</text>
  <rect x="275" y="502" width="230" height="64" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="390" y="527" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c4a6e">schema events</text>
  <text x="390" y="548" text-anchor="middle" font-size="12" fill="#0c4a6e">events · ticket_types · reservations</text>
  <rect x="640" y="502" width="310" height="64" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="795" y="527" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c4a6e">schema orders</text>
  <text x="795" y="548" text-anchor="middle" font-size="12" fill="#0c4a6e">orders (PENDING → CONFIRMED / REJECTED)</text>

  <!-- Legend -->
  <line x1="60" y1="625" x2="110" y2="625" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="120" y="629" font-size="12" fill="#374151">Panggilan sinkron (HTTP / SQL)</text>
  <line x1="340" y1="625" x2="390" y2="625" stroke="#be185d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#q)"/>
  <text x="400" y="629" font-size="12" fill="#374151">Asinkron lewat message queue (minggu 11)</text>
  <text x="60" y="660" font-size="12" fill="#6b7280">Semua service dan Worker memakai satu codebase dan satu image Docker; layanan dipilih lewat perintah start. Hanya gateway yang dibuka ke publik.</text>
</svg>
