openapi: 3.0.3
info:
  title: Platform Tiket Event/Konser (Kelompok B)
  version: 0.2.0
  description: |
    Semua akses lewat API Gateway. Endpoint GraphQL ada di POST /graphql (lihat docs/schema.graphql).
    Endpoint /internal/* tidak dapat dijangkau dari luar (gateway mengembalikan 404).
servers:
  - url: http://localhost:8080
    description: Lokal (Docker Compose)
  - url: https://GANTI-DENGAN-URL-GATEWAY
    description: Deployment
security:
  - bearerAuth: []
tags:
  - { name: Auth }
  - { name: Events }
  - { name: Orders }
paths:
  /health:
    get:
      summary: Status gateway
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string }, service: { type: string } } } } } }
  /auth/register:
    post:
      tags: [Auth]
      summary: Daftar akun pengguna
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Akun dibuat, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Email sudah terdaftar }
        '429': { $ref: '#/components/responses/RateLimited' }
  /oauth/token:
    post:
      tags: [Auth]
      summary: Minta access token (OAuth2)
      description: grant_type `password` (client publik `ticketing-web`) atau `client_credentials` (antarlayanan). Kegagalan memakai format RFC 6749.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [password, client_credentials] }
                client_id: { type: string, example: ticketing-web }
                client_secret: { type: string }
                username: { type: string, format: email }
                password: { type: string, format: password }
                scope: { type: string, example: events:read orders:read orders:write }
      responses:
        '200': { description: Token, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '400': { description: invalid_grant / invalid_request / invalid_scope / unsupported_grant_type }
        '401': { description: invalid_client }
        '429': { $ref: '#/components/responses/RateLimited' }
  /.well-known/jwks.json:
    get:
      tags: [Auth]
      summary: Kunci publik JWT (JWKS)
      security: []
      responses:
        '200': { description: JWKS }
  /auth/me:
    get:
      tags: [Auth]
      summary: Identitas dari token
      responses:
        '200': { description: Identitas, content: { application/json: { schema: { type: object, properties: { id: { type: string }, role: { type: string }, scopes: { type: array, items: { type: string } }, clientId: { type: string } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/upstreams:
    get:
      summary: Status replika upstream (service discovery) - khusus admin
      responses:
        '200': { description: Daftar upstream dan kesehatan tiap replika }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /events:
    get:
      tags: [Events]
      summary: Daftar event (scope events:read)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Cari nama atau artis }
        - { name: city, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [UPCOMING, ON_SALE, ENDED, CANCELLED] } }
        - { name: onlyAvailable, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Daftar event
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/EventSummary' } }
                  page: { $ref: '#/components/schemas/Page' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Events]
      summary: Buat event (admin, scope events:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventRequest' }
      responses:
        '201': { description: Event dibuat, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /events/{id}:
    get:
      tags: [Events]
      summary: Detail event beserta jenis tiket dan stok
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Detail, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: Event tidak ditemukan }
  /graphql:
    post:
      tags: [Events]
      summary: Katalog via GraphQL (scope events:read; mutation createEvent khusus admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, example: '{ events(limit:3){ items{ name startsAt minPrice } } }' }
                variables: { type: object }
                operationName: { type: string }
      responses:
        '200': { description: Hasil (error eksekusi ada di field `errors`) }
        '400': { description: Query tidak valid / terlalu kompleks (extensions.code = QUERY_TOO_COMPLEX) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /orders:
    post:
      tags: [Orders]
      summary: Pesan tiket (scope orders:write) - diproses asinkron lewat message queue
      description: |
        Pesanan disimpan berstatus `PENDING`, dimasukkan ke message queue, lalu diproses Worker (reservasi stok).
        Respons `202` berarti **diterima**, bukan terkonfirmasi. Baca hasil akhir (`CONFIRMED` atau `REJECTED`
        beserta `reason`) lewat `GET /orders/{id}` (polling, mis. tiap 1-2 detik) menggunakan URL di header `Location`.
        Stok tidak pernah terjual ganda: pengurangan stok atomik di database dan reservasi berkunci `orderId`.
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, pattern: '^[\w.:-]{1,64}$' }, description: Kirim ulang dengan kunci sama tidak membuat pesanan baru }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '202':
          description: Pesanan diterima dan antri untuk diproses (status PENDING)
          headers:
            Location: { description: 'URL untuk memantau pesanan, mis. /orders/{id}', schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '200': { description: Idempotency-Key sama; pesanan sebelumnya dikembalikan (status saat ini), content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: IDEMPOTENCY_KEY_REUSED (kunci dipakai untuk pesanan yang berbeda) }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Orders]
      summary: Daftar pesanan milik sendiri (scope orders:read)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Daftar pesanan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Order' } }
                  page: { $ref: '#/components/schemas/Page' }
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Detail pesanan (pemilik atau admin; selain itu 404)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Pesanan, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { description: Tidak ditemukan }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Unauthorized: { description: Token tidak ada/tidak valid/kedaluwarsa (401), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Role atau scope tidak mencukupi (403), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ValidationError: { description: Input tidak valid (400), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RateLimited: { description: Terlalu banyak permintaan (429); lihat header Retry-After, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details: { type: array, items: { type: object } }
            requestId: { type: string }
    Page:
      type: object
      properties: { limit: { type: integer }, offset: { type: integer }, total: { type: integer } }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        name: { type: string, maxLength: 100 }
    User:
      type: object
      properties: { id: { type: string, format: uuid }, email: { type: string }, name: { type: string }, role: { type: string, enum: [user, admin] } }
    TokenResponse:
      type: object
      properties: { access_token: { type: string }, token_type: { type: string, example: Bearer }, expires_in: { type: integer, example: 900 }, scope: { type: string } }
    TicketType:
      type: object
      properties: { id: { type: string, format: uuid }, name: { type: string }, price: { type: number }, total: { type: integer }, available: { type: integer } }
    EventSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        artist: { type: string }
        venue: { type: string }
        city: { type: string }
        category: { type: string }
        description: { type: string, nullable: true }
        startsAt: { type: string, format: date-time }
        status: { type: string, enum: [UPCOMING, ON_SALE, ENDED, CANCELLED] }
        minPrice: { type: number, nullable: true }
        totalAvailable: { type: integer }
    Event:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          properties: { ticketTypes: { type: array, items: { $ref: '#/components/schemas/TicketType' } } }
    CreateEventRequest:
      type: object
      required: [name, artist, venue, city, category, startsAt, ticketTypes]
      properties:
        name: { type: string }
        artist: { type: string }
        venue: { type: string }
        city: { type: string }
        category: { type: string }
        description: { type: string }
        startsAt: { type: string, format: date-time, example: '2027-01-01T19:00:00+07:00' }
        status: { type: string, enum: [UPCOMING, ON_SALE, ENDED, CANCELLED] }
        ticketTypes:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, price, total]
            properties: { name: { type: string }, price: { type: number }, total: { type: integer, minimum: 1 } }
    CreateOrderRequest:
      type: object
      required: [ticketTypeId, quantity]
      properties:
        ticketTypeId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 4 }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        eventId: { type: string, format: uuid, nullable: true }
        ticketTypeId: { type: string, format: uuid }
        quantity: { type: integer }
        unitPrice: { type: number, nullable: true }
        totalPrice: { type: number, nullable: true }
        status: { type: string, enum: [PENDING, CONFIRMED, REJECTED], description: 'PENDING = antri/sedang diproses; CONFIRMED = tiket didapat; REJECTED = ditolak (lihat reason)' }
        reason: { type: string, nullable: true, description: 'Terisi bila REJECTED: INSUFFICIENT_STOCK, TICKET_TYPE_NOT_FOUND, atau PROCESSING_FAILED (layanan stok gagal setelah semua percobaan ulang)' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
